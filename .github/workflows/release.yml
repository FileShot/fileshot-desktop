name: Release Desktop

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.0)"
        required: false
        default: "1.0.0"
        type: string
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
            rust_targets: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            rust_targets: "aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
            rust_targets: "x86_64-apple-darwin"
            continue_on_error: true
          - platform: ubuntu-latest
            args: ""
            rust_targets: ""

    runs-on: ${{ matrix.platform }}
    continue-on-error: ${{ matrix.continue_on_error == true }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Add Rust targets
        if: matrix.rust_targets != ''
        run: rustup target add ${{ matrix.rust_targets }}

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend deps
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_NET_RETRY: 10
          CARGO_HTTP_MULTIPLEXING: "false"
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('desktop-v{0}', inputs.version) }}
          releaseName: "FileShot Desktop ${{ github.ref_type == 'tag' && github.ref_name || format('desktop-v{0}', inputs.version) }}"
          releaseBody: |
            Cross-platform FileShot Desktop (Tauri 2).

            **Note:** These builds are not code-signed yet. Windows SmartScreen and macOS Gatekeeper may warn on first launch — see [install notes](https://fileshot.io/desktop).

            | Platform | Artifact |
            |----------|----------|
            | Windows x64 | `.exe` / `.msi` installer |
            | macOS Apple Silicon | `aarch64` `.dmg` |
            | macOS Intel | `x86_64` `.dmg` |
            | Linux x64 | `.AppImage` and `.deb` |

            [Source](https://github.com/FileShot/fileshot-desktop) · [Support signing](https://fileshot.io/donate)
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
